name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  inspector-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: External MCP Inspector compatibility
        run: npm run test:inspector

  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify native SQLite runtime
        run: node -e "const Database=require('better-sqlite3'); const db=new Database(':memory:'); db.prepare('select 1 as ok').get(); db.close(); console.log('better-sqlite3 open/query OK')"

      - name: Smoke test (no Ollama required)
        run: npm run smoke

      - name: Parse test
        run: npm run test:parse

      - name: Security evaluation
        run: npm run test:security

      - name: Search regression
        run: npm run test:search-regression

      - name: Retrieval evaluation
        run: npm run eval

      - name: E2E test (stdio MCP protocol)
        run: npm run test:e2e

      - name: E2E test (remote Streamable HTTP MCP)
        run: npm run test:http

      - name: Package smoke
        run: npm run test:package

      - name: Audit
        run: npm audit --audit-level=high

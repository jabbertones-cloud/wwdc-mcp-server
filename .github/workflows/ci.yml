name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Public PR CI must use an isolated free standard macOS ARM64 GitHub VM.
# Public release/registry jobs use isolated free hosted macOS ARM64, with OIDC retained.
concurrency:
  group: wwdc-public-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    # New ephemeral GitHub VM for every public PR; fork code never reaches M1.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Verify isolated free macOS ARM64 runner
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
          test "${RUNNER_OS:-}" = "macOS"
          test "${RUNNER_ARCH:-}" = "ARM64"
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Verify public CI and protected release separation
        run: node --test tests/ci-isolation-policy.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Verify native SQLite runtime
        run: node -e "const Database=require('better-sqlite3'); const db=new Database(':memory:'); db.prepare('select 1 as ok').get(); db.close(); console.log('SQLite native OK')"

      - name: Full test suite including optional AiSCent handoff
        run: npm test

      - name: External MCP Inspector compatibility
        run: npm run test:inspector

      - name: Audit dependencies
        run: npm audit --audit-level=high

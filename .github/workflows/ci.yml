name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Physical SMAT M1 only. Never fall back to GitHub-hosted Ubuntu, NAS or Intel.
concurrency:
  group: wwdc-m1-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: [self-hosted, macOS, ARM64, smat-m1, wwdc-ci]
    timeout-minutes: 60
    steps:
      - name: Verify M1 runner authority
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "smat-m1-wwdc-ci"
          test "${RUNNER_OS}" = "macOS"
          test "$(hostname)" = "Tatsheens-Mini"
          test "$(uname -m)" = "arm64"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Verify native SQLite runtime
        run: node -e "const Database=require('better-sqlite3'); const db=new Database(':memory:'); db.prepare('select 1 as ok').get(); db.close(); console.log('SQLite native OK')"

      - name: Full test suite including optional AiSCent handoff
        run: npm test

      - name: External MCP Inspector compatibility
        run: npm run test:inspector

      - name: Audit dependencies
        run: npm audit --audit-level=high

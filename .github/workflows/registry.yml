name: Publish MCP Registry

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Install MCP publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Validate Registry manifest
        run: ./mcp-publisher validate server.json

      - name: Authenticate to official MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish official MCP Registry entry
        run: ./mcp-publisher publish server.json

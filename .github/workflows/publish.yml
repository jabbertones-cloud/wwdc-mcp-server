name: Publish public release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          package-manager-cache: false

      - name: Upgrade npm
        run: npm install --global npm@latest

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high

      - name: Verify tag and release metadata
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          SERVER_VERSION="$(node -e "import('./dist/server.js').then(m=>process.stdout.write(m.SERVER_VERSION))")"
          REGISTRY_VERSION="$(node -p "require('./server.json').version")"
          REGISTRY_PACKAGE_VERSION="$(node -p "require('./server.json').packages[0].version")"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"
          test "$PACKAGE_VERSION" = "$LOCK_VERSION"
          test "$PACKAGE_VERSION" = "$SERVER_VERSION"
          test "$PACKAGE_VERSION" = "$REGISTRY_VERSION"
          test "$PACKAGE_VERSION" = "$REGISTRY_PACKAGE_VERSION"

  registry:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Install MCP publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Validate Registry manifest
        run: ./mcp-publisher validate server.json

      - name: Authenticate to official MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish official MCP Registry entry
        run: ./mcp-publisher publish server.json

  npm:
    needs: verify
    if: ${{ vars.ENABLE_NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm install --global npm@latest
      - run: npm ci
      - name: Publish optional npm distribution with OIDC
        run: npm publish --access public

name: Publish public release

on:
  release:
    types: [published]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          package-manager-cache: false

      - name: Upgrade npm
        run: npm install --global npm@latest

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          SERVER_VERSION="$(node -e "import('./dist/server.js').then(m=>process.stdout.write(m.SERVER_VERSION))")"
          REGISTRY_VERSION="$(node -p "require('./server.json').version")"
          REGISTRY_PACKAGE_VERSION="$(node -p "require('./server.json').packages[0].version")"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"
          test "$PACKAGE_VERSION" = "$LOCK_VERSION"
          test "$PACKAGE_VERSION" = "$SERVER_VERSION"
          test "$PACKAGE_VERSION" = "$REGISTRY_VERSION"
          test "$PACKAGE_VERSION" = "$REGISTRY_PACKAGE_VERSION"

  registry:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          package-manager-cache: false

      - name: Upgrade npm
        run: npm install --global npm@latest

      - name: Runtime-test published MCPB
        shell: bash
        run: |
          set -euo pipefail
          URL="$(node -p "require('./server.json').packages[0].identifier")"
          EXPECTED="$(node -p "require('./server.json').packages[0].fileSha256")"
          curl -fsSL "$URL" -o /tmp/wwdc.mcpb
          ACTUAL="$(sha256sum /tmp/wwdc.mcpb | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          rm -rf /tmp/wwdc-bundle
          mkdir -p /tmp/wwdc-bundle
          unzip -q /tmp/wwdc.mcpb -d /tmp/wwdc-bundle
          python3 - <<'PY'
          import json, os, select, subprocess, sys, time
          env = os.environ.copy()
          env["WWDC_MCP_DATA_DIR"] = "/tmp/wwdc-runtime-data"
          p = subprocess.Popen(
              ["node", "/tmp/wwdc-bundle/server/index.js"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              env=env,
          )
          msg = {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "initialize",
              "params": {
                  "protocolVersion": "2025-06-18",
                  "capabilities": {},
                  "clientInfo": {"name": "release-runtime-probe", "version": "1.0.0"},
              },
          }
          p.stdin.write(json.dumps(msg) + "\n")
          p.stdin.flush()
          deadline = time.time() + 180
          errors = []
          while time.time() < deadline:
              ready, _, _ = select.select([p.stdout, p.stderr], [], [], 1)
              for stream in ready:
                  line = stream.readline()
                  if not line:
                      continue
                  if stream is p.stderr:
                      errors.append(line.rstrip())
                      continue
                  if line.strip():
                      payload = json.loads(line)
                      info = payload.get("result", {}).get("serverInfo", {})
                      if info.get("name") != "wwdc-mcp-server":
                          raise SystemExit(f"unexpected server info: {info}")
                      print(json.dumps({"protocolVersion": payload.get("result", {}).get("protocolVersion"), "serverInfo": info}))
                      p.terminate()
                      raise SystemExit(0)
              if p.poll() is not None:
                  break
          try:
              p.terminate()
          except Exception:
              pass
          print("runtime probe failed", errors[-40:], file=sys.stderr)
          raise SystemExit(1)
          PY

      - name: Install MCP publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Validate Registry manifest
        run: ./mcp-publisher validate server.json

      - name: Authenticate to official MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish official MCP Registry entry
        run: ./mcp-publisher publish server.json

      - name: Deprecate broken v0.2.0 Registry entry
        if: ${{ github.event.release.tag_name == 'v0.2.1' }}
        run: |
          ./mcp-publisher status             --status deprecated             --message "Superseded by v0.2.1: fixes npm 12 remote-tarball launch compatibility."             io.github.jabbertones-cloud/wwdc 0.2.0

  npm:
    needs: verify
    if: ${{ vars.ENABLE_NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm install --global npm@latest
      - run: npm ci
      - name: Publish optional npm distribution with OIDC
        run: npm publish --access public

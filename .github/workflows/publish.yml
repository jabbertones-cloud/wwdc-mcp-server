name: Publish public release

on:
  push:
    tags:
      - "v*"
    branches:
      - "release-v0.2.0"

jobs:
  bootstrap-tag:
    if: github.ref == 'refs/heads/release-v0.2.0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create matching release tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          test "$VERSION" = "0.2.0"
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "WWDC MCP $TAG"
          git push origin "$TAG"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install --global npm@latest

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high

      - name: Verify tag, package, runtime, and Registry versions agree
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          SERVER_VERSION="$(node -e "import('./dist/server.js').then(m=>process.stdout.write(m.SERVER_VERSION))")"
          REGISTRY_VERSION="$(node -p "require('./server.json').version")"
          PACKAGE_REGISTRY_VERSION="$(node -p "require('./server.json').packages[0].version")"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"
          test "$PACKAGE_VERSION" = "$SERVER_VERSION"
          test "$PACKAGE_VERSION" = "$REGISTRY_VERSION"
          test "$PACKAGE_VERSION" = "$PACKAGE_REGISTRY_VERSION"

      - name: Install MCP publisher and validate Registry manifest
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher validate server.json

      - name: Refuse an already-published version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "wwdc-mcp-server@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "::error::wwdc-mcp-server@$PACKAGE_VERSION already exists on npm"
            exit 1
          fi

      - name: Publish npm package
        shell: bash
        env:
          NPM_TOKEN_SECRET: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN_SECRET:-}" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN_SECRET"
            echo "Using configured npm bootstrap token."
          else
            unset NODE_AUTH_TOKEN || true
            echo "No npm token configured; attempting npm trusted-publishing OIDC."
          fi
          npm publish --access public

      - name: Authenticate to official MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to official MCP Registry
        run: ./mcp-publisher publish server.json

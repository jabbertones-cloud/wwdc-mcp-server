name: Publish public release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install --global npm@latest

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high

      - name: Verify tag, package, runtime, and Registry versions agree
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          SERVER_VERSION="$(node -e "import('./dist/server.js').then(m=>process.stdout.write(m.SERVER_VERSION))")"
          REGISTRY_VERSION="$(node -p "require('./server.json').version")"
          PACKAGE_REGISTRY_VERSION="$(node -p "require('./server.json').packages[0].version")"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"
          test "$PACKAGE_VERSION" = "$SERVER_VERSION"
          test "$PACKAGE_VERSION" = "$REGISTRY_VERSION"
          test "$PACKAGE_VERSION" = "$PACKAGE_REGISTRY_VERSION"

      - name: Install MCP publisher and validate Registry manifest
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher validate server.json

      - name: Refuse an already-published version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "wwdc-mcp-server@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "::error::wwdc-mcp-server@$PACKAGE_VERSION already exists on npm"
            exit 1
          fi

      - name: Publish npm package with OIDC trusted publishing
        run: npm publish --access public

      - name: Authenticate to official MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to official MCP Registry
        run: ./mcp-publisher publish server.json

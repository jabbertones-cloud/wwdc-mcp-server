name: Bug report
description: Report a reproducible WWDC MCP defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve WWDC MCP. Do not include credentials, private repository content, or Apple account data.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.2.1 or commit SHA
    validations: { required: true }
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options: [stdio, Streamable HTTP private, Streamable HTTP public read-only, not sure]
    validations: { required: true }
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Codex, Claude, Cursor, VS Code, Windsurf, Zed, other
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps, command/tool call, expected result, and actual result.
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or source URL
      description: Redact secrets and private paths.

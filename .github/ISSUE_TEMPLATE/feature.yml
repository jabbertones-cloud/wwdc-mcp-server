name: Feature request
description: Propose a source, retrieval, audit, or interoperability improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Developer problem
      description: What Apple-development job is hard today? Start with the user problem, not a tool name.
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: Apple/Swift sources involved
      description: Which authoritative sources would make this useful?
  - type: textarea
    id: workflow
    attributes:
      label: Desired agent workflow
      description: Show the question an agent should be able to answer or audit.
